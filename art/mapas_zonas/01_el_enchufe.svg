  <ellipse cx="340" cy="260" rx="200" ry="140" fill="#00bcd4" opacity="0.25"/>
  <!-- Corredores a los 4 bordes -->
  <rect x="320" y="40" width="40" height="80" fill="#00bcd4" opacity="0.6"/>
  <rect x="320" y="360" width="40" height="80" fill="#00bcd4" opacity="0.6"/>
  <rect x="20" y="240" width="60" height="40" fill="#00bcd4" opacity="0.6"/>
  <rect x="600" y="240" width="60" height="40" fill="#00bcd4" opacity="0.6"/>
  <rect x="600" y="200" width="60" height="40" fill="#00bcd4" opacity="0.6"/>
  <!-- Infraestructura antigua (edificios) -->
  <rect x="280" y="200" width="60" height="40" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="200" width="50" height="40" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="280" y="260" width="40" height="30" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="260" width="40" height="30" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Vegetación (árboles) -->
  <circle cx="120" cy="120" r="12" fill="#2FBF71" opacity="0.6"/>
  <circle cx="160" cy="140" r="10" fill="#2FBF71" opacity="0.5"/>
  <circle cx="520" cy="120" r="12" fill="#2FBF71" opacity="0.6"/>
  <circle cx="560" cy="140" r="10" fill="#2FBF71" opacity="0.5"/>
  <circle cx="120" cy="380" r="12" fill="#2FBF71" opacity="0.6"/>
  <circle cx="520" cy="380" r="12" fill="#2FBF71" opacity="0.6"/>
  <!-- Punto de guardado -->
  <circle cx="340" cy="260" r="6" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  
  <!-- Etiquetas de bordes -->
  
  
  
  
  
  
