<?xml version="1.0" encoding="UTF-8"?>
<!--
  señal_03 · Caja reutilizada
  Origen: brief del director (señales improvisadas de Bug de Familia)
  Herramienta: generación de SVG por código
  Lienzo 512x320 · fondo transparente · piezas editables
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320">

  <defs>
    <linearGradient id="s3_frente" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#9B7550"/>
      <stop offset="0.6" stop-color="#7E5A38"/>
      <stop offset="1" stop-color="#5A3F28"/>
    </linearGradient>
    <linearGradient id="s3_tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9835A"/>
      <stop offset="1" stop-color="#7C5A3A"/>
    </linearGradient>
    <linearGradient id="s3_lado" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E3623"/>
      <stop offset="1" stop-color="#3A2718"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="268" cy="302" rx="160" ry="14" fill="#1B0E2A" opacity="0.25"/>

  <g id="s3_caja" stroke="#1B0E2A" stroke-width="7" stroke-linejoin="round"
     stroke-linecap="round">

    <!-- cara superior -->
    <path d="M126 148 L378 132 L410 100 L158 116 Z" fill="url(#s3_tapa)"/>
    <!-- veta de la cara superior -->
    <path d="M158 116 L410 100 M170 126 L396 111" fill="none" stroke="#5A3F28"
          stroke-width="3" opacity="0.8"/>

    <!-- lateral derecho -->
    <path d="M378 132 L410 100 L414 258 L382 290 Z" fill="url(#s3_lado)"/>

    <!-- frente -->
    <path d="M126 148 L378 132 L382 290 L130 300 Z" fill="url(#s3_frente)"/>

    <!-- tablas horizontales -->
    <g fill="none" stroke="#4E3623" stroke-width="3" opacity="0.85">
      <path d="M126.6 170.8 L378.6 155.7"/>
      <path d="M127.4 201.2 L379.4 187.3"/>
      <path d="M129 262 L381 250.5"/>
    </g>
    <g fill="none" stroke="#A9835A" stroke-width="2.5" opacity="0.5">
      <path d="M127 164 L379 149"/>
      <path d="M129.3 268 L381.3 256.5"/>
    </g>

    <!-- refuerzos verticales en los cantos -->
    <g fill="#6E4E33" stroke="#1B0E2A" stroke-width="4">
      <path d="M138 146 L149 145 L153 297 L142 297 Z"/>
      <path d="M367 133 L378 132 L382 291 L371 291 Z"/>
    </g>

    <!-- esquinas metálicas con remaches -->
    <g fill="#7E8697" stroke="#1B0E2A" stroke-width="4" stroke-linejoin="round">
      <path d="M126 148 L176 145 L176 158 L138 160 L136 196 L126 196 Z"/>
      <path d="M378 132 L410 130 L412 168 L400 168 L398 144 L378 145 Z"/>
      <path d="M132 288 L182 285 L182 298 L132 300 Z"/>
    </g>
    <g fill="#B9703F" stroke="#1B0E2A" stroke-width="2.5">
      <circle cx="140" cy="156" r="3.5"/>
      <circle cx="160" cy="152" r="3.5"/>
      <circle cx="392" cy="146" r="3.5"/>
      <circle cx="152" cy="292" r="3.5"/>
    </g>

    <!-- golpe con astillas -->
    <path d="M344 214 q14 -6 22 4 q-4 12 -18 10 q-8 -6 -4 -14z" fill="#2B1C11"
          stroke="#1B0E2A" stroke-width="3"/>
    <path d="M340 210 L332 202 M366 224 L376 232" stroke="#A9835A" stroke-width="3"
          stroke-linecap="round"/>

    <!-- letras de estarcido -->
    <g transform="rotate(-3 254 232)">
      <text x="254" y="250" text-anchor="middle"
            font-family="Impact, 'Arial Black', sans-serif" font-weight="bold"
            font-size="40" letter-spacing="2" fill="#E8C24E" stroke="none"
            >REFUGIO</text>
      <!-- chorretones de espray -->
      <g fill="#D9B44A" opacity="0.55">
        <path d="M168 254 q3 12 0 18 q-6 -4 0 -18z"/>
        <path d="M300 250 q3 10 1 16 q-6 -4 -1 -16z"/>
      </g>
      <g fill="#D9B44A" opacity="0.7">
        <circle cx="150" cy="214" r="2.5"/>
        <circle cx="162" cy="206" r="1.8"/>
        <circle cx="356" cy="228" r="2.5"/>
        <circle cx="344" cy="240" r="2"/>
      </g>
      <!-- marco de estarcido -->
      <path d="M146 200 L368 188 M148 268 L370 256" fill="none"
            stroke="#D9B44A" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- cinta de reparación -->
    <path d="M212 288 L268 284 L270 296 L214 300 Z" fill="#9BA3B4"
          stroke="#1B0E2A" stroke-width="3"/>
    <path d="M220 292 L262 289" stroke="#B6BCC8" stroke-width="2"/>
  </g>

  <!-- sello y etiqueta de transporte vieja -->
  <g id="s3_etiqueta" transform="rotate(9 96 244)">
    <path d="M60 224 L124 220 L128 268 L64 272 Z" fill="#CFC3A6" stroke="#1B0E2A"
          stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 236 h44 M70 248 h30 M70 260 h38" stroke="#6A2A20" stroke-width="3"
          stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
