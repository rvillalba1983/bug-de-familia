<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#9c27b0" stroke-width="2"/>
  <rect x="20" y="40" width="640" height="440" fill="#9c27b0" opacity="0.1"/>
  <!-- Forma alargada: bloqueados en esquinas -->
  <rect x="20" y="40" width="50" height="70" fill="#0d1b2a"/>
  <rect x="20" y="370" width="50" height="70" fill="#0d1b2a"/>
  <rect x="610" y="40" width="50" height="60" fill="#0d1b2a"/>
  <rect x="610" y="380" width="50" height="60" fill="#0d1b2a"/>
  <rect x="100" y="140" width="120" height="60" fill="#0d1b2a"/>
  <!-- Cámara de resonancia (centro) -->
  <ellipse cx="340" cy="260" rx="120" ry="80" fill="#9c27b0" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  
  
  <!-- Túneles acústicos -->
  <rect x="100" y="240" width="120" height="40" fill="#9c27b0" opacity="0.4" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="460" y="240" width="120" height="40" fill="#9c27b0" opacity="0.4" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Manada (rutas) -->
  <rect x="120" y="120" width="60" height="40" fill="#ff9800" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="500" y="120" width="60" height="40" fill="#ff9800" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Corredores -->
  <rect x="0" y="240" width="105" height="40" fill="#9c27b0" opacity="0.6"/>
  <rect x="575" y="240" width="105" height="40" fill="#9c27b0" opacity="0.6"/>
  <rect x="320" y="40" width="40" height="140" fill="#9c27b0" opacity="0.6"/>
  <rect x="320" y="340" width="40" height="140" fill="#9c27b0" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="160" cy="260" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="520" cy="260" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="340" cy="180" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <!-- Etiquetas de bordes -->
  
  
  
  
  
</svg>
