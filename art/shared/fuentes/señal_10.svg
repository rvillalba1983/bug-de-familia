<?xml version="1.0" encoding="UTF-8"?>
<!--
  señal_10 · Bidón reutilizado
  Origen: brief del director (señales improvisadas de Bug de Familia)
  Herramienta: generación de SVG por código
  Lienzo 512x320 · fondo transparente · piezas editables
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320">

  <defs>
    <linearGradient id="s10_cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C5566"/>
      <stop offset="0.22" stop-color="#8C93A2"/>
      <stop offset="0.62" stop-color="#767E8E"/>
      <stop offset="1" stop-color="#404857"/>
    </linearGradient>
    <linearGradient id="s10_tapa" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A3AAB9"/>
      <stop offset="1" stop-color="#68707F"/>
    </linearGradient>
    <linearGradient id="s10_franja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2B14A"/>
      <stop offset="1" stop-color="#B08F2E"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="256" cy="300" rx="112" ry="13" fill="#1B0E2A" opacity="0.26"/>

  <!-- cuerpo del bidón -->
  <g id="s10_bidon" stroke="#1B0E2A" stroke-width="7" stroke-linejoin="round"
     stroke-linecap="round">

    <path d="M156 92 L156 268 A100 24 0 0 0 356 268 L356 92 Z"
          fill="url(#s10_cuerpo)"/>

    <!-- franja pintada -->
    <path d="M156 168 Q256 190 356 168 L356 234 Q256 256 156 234 Z"
          fill="url(#s10_franja)" stroke="#1B0E2A" stroke-width="4"/>

    <!-- letras -->
    <text x="256" y="220" text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif" font-weight="bold"
          font-size="38" letter-spacing="2" fill="#3A2A14" stroke="none"
          >PELIGRO</text>

    <!-- desconchones de la franja -->
    <g fill="url(#s10_cuerpo)" stroke="#1B0E2A" stroke-width="3">
      <path d="M168 174 q16 -4 20 8 q-8 8 -22 2 q-4 -6 2 -10z"/>
      <path d="M330 214 q18 -6 24 6 q-8 10 -26 4 q-4 -6 2 -10z"/>
    </g>
    <g fill="#C9A62C" opacity="0.6">
      <path d="M170 238 q3 12 0 18 q-6 -4 0 -18z"/>
      <path d="M300 246 q3 10 0 14 q-6 -4 0 -14z"/>
    </g>

    <!-- nervios del bidón -->
    <g fill="none" stroke="#1B0E2A" stroke-width="5">
      <path d="M156 128 Q256 150 356 128"/>
      <path d="M156 262 Q256 284 356 262"/>
    </g>
    <g fill="none" stroke="#A3AAB9" stroke-width="2.5" opacity="0.55">
      <path d="M156 124 Q256 146 356 124"/>
      <path d="M156 258 Q256 280 356 258"/>
    </g>

    <!-- abolladura -->
    <g fill="none" stroke="#4C5566" stroke-width="3.5" stroke-linecap="round">
      <path d="M182 108 q26 14 54 8"/>
      <path d="M300 246 q26 8 42 0"/>
    </g>

    <!-- óxido y agujero -->
    <g stroke="#1B0E2A" stroke-width="3" stroke-linejoin="round">
      <path d="M318 250 q22 -4 30 8 q-10 10 -26 4 q-8 -6 -4 -12z" fill="#A8482A"/>
      <path d="M176 250 q16 6 14 18 q-14 2 -18 -10 q0 -6 4 -8z" fill="#6A2A20"/>
    </g>
    <g fill="none" stroke="#B9703F" stroke-width="3" stroke-linecap="round">
      <path d="M172 276 q4 12 0 18"/>
      <path d="M332 274 q4 10 0 16"/>
    </g>

    <!-- arañazos -->
    <g stroke="#C2C8D2" stroke-width="2.5" stroke-linecap="round"
       opacity="0.45">
      <path d="M196 100 L246 112 M210 98 L260 110 M286 96 L318 106"/>
    </g>

    <!-- tapa ligeramente torcida -->
    <g id="s10_tapa" transform="rotate(-5 256 92)">
      <ellipse cx="256" cy="92" rx="100" ry="24" fill="url(#s10_tapa)"/>
      <ellipse cx="256" cy="92" rx="74" ry="15" fill="none" stroke="#1B0E2A"
               stroke-width="4"/>
      <g fill="#B9703F" stroke="#1B0E2A" stroke-width="2.5">
        <circle cx="180" cy="84" r="4"/>
        <circle cx="332" cy="84" r="4"/>
        <circle cx="256" cy="70" r="4"/>
        <circle cx="256" cy="114" r="4"/>
      </g>
      <!-- tapón -->
      <ellipse cx="304" cy="86" rx="16" ry="8" fill="#6C7486"
               stroke="#1B0E2A" stroke-width="4"/>
      <path d="M292 84 q12 -6 24 0" fill="none" stroke="#3F4757"
            stroke-width="3"/>
    </g>

    <!-- grasa y mugre en la base -->
    <path d="M164 282 q26 -10 52 -2 q28 8 62 0 q30 -8 62 2 q-24 12 -88 12
             q-64 0 -88 -12z" fill="#3A2F22" opacity="0.55" stroke="none"/>
  </g>

  <!-- tablón apoyado en el bidón -->
  <g stroke="#1B0E2A" stroke-width="6" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M392 300 L412 176 L430 180 L416 302 Z" fill="#7C5A3A"/>
    <path d="M404 230 L418 228" stroke="#4A3020" stroke-width="3"/>
  </g>

  <!-- hierba -->
  <g fill="none" stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
    <path d="M120 302 q8 -16 0 -26"/>
    <path d="M134 304 q10 -12 6 -22"/>
  </g>
</svg>
