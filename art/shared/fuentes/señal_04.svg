    <path d="M296 288 q16 2 30 -2" fill="none" stroke="#6A2A20" stroke-width="3"/>
  </g>
  <g fill="#C0B091" stroke="#1B0E2A" stroke-width="3.5">
    <ellipse cx="296" cy="118" rx="9" ry="7"/>
    <ellipse cx="296" cy="192" rx="9" ry="7"/>
    <ellipse cx="292" cy="264" rx="9" ry="7"/>
  </g>

  <!-- hierba seca en la base -->
  <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
    <path d="M224 302 q14 -18 30 -4 q10 8 20 2 q-8 12 -26 10 q-18 -2 -24 -8z"
