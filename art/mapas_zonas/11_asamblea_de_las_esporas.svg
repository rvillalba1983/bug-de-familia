  <!-- Mohócratas (zonas fúngicas) -->
  <circle cx="120" cy="120" r="40" fill="#009688" opacity="0.5"/>
  <circle cx="560" cy="120" r="40" fill="#009688" opacity="0.5"/>
  <circle cx="120" cy="380" r="35" fill="#009688" opacity="0.5"/>
