  <rect x="0" y="230" width="40" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="560" y="230" width="40" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="320" y="300" width="40" height="40" fill="#2196f3" opacity="0.6"/>
