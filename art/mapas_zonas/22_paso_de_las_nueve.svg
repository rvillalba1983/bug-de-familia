<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#9e9e9e" stroke-width="2"/>
  <rect x="20" y="40" width="640" height="440" fill="#9e9e9e" opacity="0.1"/>
  <rect x="0" y="0" width="30" height="30" fill="#0d1b2a"/>
  <rect x="140" y="0" width="30" height="25" fill="#0d1b2a"/>
  <rect x="0" y="120" width="35" height="30" fill="#0d1b2a"/>
  <rect x="135" y="125" width="35" height="25" fill="#0d1b2a"/>
  <rect x="45" y="45" width="25" height="20" fill="#0d1b2a"/>
  <rect x="100" y="75" width="25" height="20" fill="#0d1b2a"/>
  <!-- Paso (zigzag) -->
  <rect x="40" y="80" width="60" height="30" fill="#9e9e9e" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="80" width="40" height="30" fill="#9e9e9e" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="110" width="100" height="30" fill="#9e9e9e" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="140" width="60" height="30" fill="#9e9e9e" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="140" width="40" height="30" fill="#9e9e9e" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <!-- Jubilados (taller) -->
  <rect x="260" y="180" width="60" height="40" fill="#9e9e9e" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="340" y="180" width="60" height="40" fill="#9e9e9e" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="260" y="240" width="60" height="40" fill="#9e9e9e" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Mohócratas (zona fúngica) -->
  <circle cx="460" cy="120" r="40" fill="#009688" opacity="0.5"/>
  <circle cx="540" cy="180" r="35" fill="#009688" opacity="0.5"/>
  <circle cx="500" cy="260" r="30" fill="#009688" opacity="0.5"/>
  <!-- Corredores -->
  <rect x="80" y="0" width="15" height="30" fill="#9e9e9e" opacity="0.6"/>
  <rect x="80" y="120" width="15" height="30" fill="#9e9e9e" opacity="0.6"/>
  <rect x="0" y="60" width="40" height="15" fill="#9e9e9e" opacity="0.6"/>
  <rect x="130" y="60" width="40" height="15" fill="#9e9e9e" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="70" cy="80" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="290" cy="200" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="500" cy="180" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <!-- Etiquetas de bordes -->
  
  
  
  
