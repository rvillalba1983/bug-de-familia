<?xml version="1.0" encoding="UTF-8"?>
<!--
  señal_06 · Huesos apilados
  Origen: brief del director (señales improvisadas de Bug de Familia)
  Herramienta: generación de SVG por código
  Lienzo 512x320 · fondo transparente · piezas editables
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320">

  <defs>
    <linearGradient id="s6_cuero" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#D2C29C"/>
      <stop offset="0.6" stop-color="#B7A47E"/>
      <stop offset="1" stop-color="#93825F"/>
    </linearGradient>
    <linearGradient id="s6_hueso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E8CE"/>
      <stop offset="0.6" stop-color="#E0D2B0"/>
      <stop offset="1" stop-color="#C4B28C"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="258" cy="306" rx="168" ry="13" fill="#1B0E2A" opacity="0.24"/>

  <!-- estacas de hueso, cada una inclinada a su aire -->
  <g id="s6_estacas" stroke="#1B0E2A" stroke-linecap="round"
     stroke-linejoin="round">
    <g fill="url(#s6_hueso)" stroke-width="6">
      <g transform="rotate(-4 120 240)">
        <path d="M109 180 q0 -10 11 -10 q11 0 11 10 L131 288 q0 10 -11 10
                 q-11 0 -11 -10 Z"/>
        <circle cx="120" cy="172" r="18"/>
        <circle cx="120" cy="290" r="15"/>
      </g>
      <g transform="rotate(5 400 240)">
        <path d="M389 184 q0 -10 11 -10 q11 0 11 10 L411 288 q0 10 -11 10
                 q-11 0 -11 -10 Z"/>
        <circle cx="400" cy="176" r="18"/>
        <circle cx="400" cy="290" r="15"/>
      </g>
    </g>
    <!-- tendones atados -->
    <g fill="none" stroke="#A89876" stroke-width="4" stroke-linecap="round">
      <path d="M106 248 q16 6 30 0"/>
      <path d="M388 258 q16 6 30 0"/>
    </g>
  </g>

  <!-- cuero tensado con el mensaje -->
  <g id="s6_cuero">
    <path d="M112 168 L404 158 L410 190 L412 228 L392 236 L376 224 L360 238
             L342 222 L326 236 L308 224 L292 238 L274 224 L258 236 L242 222
             L226 236 L210 222 L194 234 L178 222 L162 232 L146 220 L124 230
             L116 208 Z"
          fill="url(#s6_cuero)" stroke="#1B0E2A" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- arrugas -->
    <g fill="none" stroke="#8A7A58" stroke-width="3" opacity="0.7"
       stroke-linecap="round">
      <path d="M140 184 q60 -6 120 -4 q60 2 118 -6"/>
      <path d="M136 210 q70 6 140 2 q60 -4 116 2"/>
    </g>

    <!-- letras pintadas con ocre -->
    <text x="258" y="209" text-anchor="middle" transform="rotate(-1.5 258 209)"
          font-family="Impact, 'Arial Black', sans-serif" font-weight="bold"
          font-size="34" letter-spacing="1.5" fill="#5C3A14" stroke="none"
          >NO MOLESTAR</text>
    <path d="M300 190 q4 8 1 14 q-6 -3 -1 -14z" fill="#5C3A14" opacity="0.55"/>

    <!-- remiendos de tendón -->
    <g stroke="#8A7A58" stroke-width="2.5" stroke-linecap="round">
      <path d="M170 166 L166 180 M186 166 L182 180 M202 165 L198 179"/>
      <path d="M330 162 L326 176 M346 161 L342 175"/>
    </g>
  </g>

  <!-- calavera -->
  <g id="s6_calavera" stroke="#1B0E2A" stroke-width="6" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M222 120 q0 -40 34 -40 q34 0 34 40 q0 22 -12 32 l0 16
             q-22 10 -44 0 l0 -16 q-12 -10 -12 -32z" fill="url(#s6_hueso)"/>
    <ellipse cx="242" cy="118" rx="9" ry="11" fill="#2B1C11" stroke-width="4"/>
    <ellipse cx="272" cy="118" rx="9" ry="11" fill="#2B1C11" stroke-width="4"/>
    <path d="M256 130 l-6 10 l12 0 Z" fill="#2B1C11" stroke-width="3"/>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M240 156 v8 M248 158 v8 M256 159 v8 M264 158 v8 M272 156 v8"/>
    </g>
    <path d="M232 92 q8 -6 16 -2" fill="none" stroke-width="3" opacity="0.8"/>
    <path d="M268 84 q10 0 14 8" fill="none" stroke="#8A7A58" stroke-width="2.5"/>
  </g>

  <!-- amarras de tendón -->
  <g stroke="#8A7A58" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M110 162 q26 6 4 22 q-6 8 8 12"/>
    <path d="M406 154 q-24 8 -2 22 q8 8 -6 12"/>
  </g>

  <!-- pila de huesos al pie -->
  <g id="s6_pila" stroke="#1B0E2A" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="5" fill="url(#s6_hueso)">
      <path d="M150 252 q-12 -10 0 -18 q10 -6 20 0 h44 q10 -6 20 0
               q12 8 0 18 q-10 6 -20 0 h-44 q-10 6 -20 0z"/>
      <circle cx="152" cy="244" r="10"/>
      <circle cx="236" cy="244" r="10"/>
    </g>
    <g stroke-width="5" fill="url(#s6_hueso)">
      <path d="M286 274 q-12 -10 0 -18 q10 -6 20 0 h52 q10 -6 20 0
               q12 8 0 18 q-10 6 -20 0 h-52 q-10 6 -20 0z"/>
      <circle cx="288" cy="266" r="10"/>
      <circle cx="380" cy="266" r="10"/>
    </g>
    <g stroke-width="5" fill="url(#s6_hueso)">
      <path d="M176 290 q-14 -11 0 -20 q11 -7 22 0 h74 q11 -7 22 0
               q14 9 0 20 q-11 7 -22 0 h-74 q-11 7 -22 0z"/>
      <circle cx="178" cy="281" r="11"/>
      <circle cx="316" cy="281" r="11"/>
    </g>

    <!-- costillas apoyadas -->
    <g fill="none" stroke="#1B0E2A" stroke-width="6" stroke-linecap="round">
      <path d="M62 300 q10 -46 6 -70"/>
      <path d="M84 302 q14 -40 12 -62"/>
    </g>
    <g fill="none" stroke="#DCCCA8" stroke-width="3" stroke-linecap="round">
      <path d="M62 300 q10 -46 6 -70"/>
      <path d="M84 302 q14 -40 12 -62"/>
    </g>

    <!-- huesecillos sueltos -->
    <g fill="#D8C9A6" stroke="#1B0E2A" stroke-width="4"
       stroke-linecap="round">
      <ellipse cx="416" cy="302" rx="16" ry="6"/>
      <ellipse cx="446" cy="294" rx="11" ry="5"/>
    </g>
  </g>
</svg>
