          font-size="44" letter-spacing="2" fill="#6A2A20">SALIDA</text>
    <path d="M158 156 q6 10 2 20 q-6 -4 -2 -20z" fill="#6A2A20" opacity="0.6"/>

    <!-- desgarro -->
    <path d="M296 138 L302 172 L294 176 Z" fill="#6F6350" stroke="#1B0E2A"
