    <path d="M140 204 q4 10 1 16 q-7 -3 -1 -16z" fill="#6A2A20" opacity="0.55"/>

    <!-- pintadas rupestres -->
    <g fill="none" stroke="#A8482A" stroke-width="4" stroke-linecap="round">
