<?xml version="1.0" encoding="UTF-8"?>
<!--
  fachada_corredor_04 · Bloque con carteles, grafiti y ventanas chapadas
  Bug de Familia · P-53 (fachadas genéricas de corredor)
  Origen: dibujo propio; no usa material de terceros
  Herramienta: edición manual de SVG (formas, trazos y degradados)
  Lienzo 400 x 240 · sin fondo · se estira al frente del pasillo (200 u de alto)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="f4_muro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA4C0"/>
      <stop offset="0.5" stop-color="#6A729A"/>
      <stop offset="1" stop-color="#4A5478"/>
    </linearGradient>
    <linearGradient id="f4_cornisa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8894B5"/>
      <stop offset="1" stop-color="#4A5478"/>
    </linearGradient>
    <linearGradient id="f4_papel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F6E7C8"/>
      <stop offset="1" stop-color="#CFC0A2"/>
    </linearGradient>
    <linearGradient id="f4_chapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8B2CC"/>
      <stop offset="1" stop-color="#6A729A"/>
    </linearGradient>
  </defs>

  <!-- muro: más claro que los otros modelos para variar el tono del pasillo -->
  <rect x="0" y="0" width="400" height="240" fill="url(#f4_muro)"/>
  <g fill="#1B0E2A" opacity="0.12">
    <path d="M0 84q60 10 120 4t140 2t140 -6v14q-60 10-140 4t-140 2t-120 -4z"/>
    <path d="M0 178q70 8 150 2t250 0v12q-90 8-250 2t-150 -2z"/>
  </g>
  <g stroke="#1B0E2A" stroke-width="2" fill="none" opacity="0.12">
    <path d="M64 0V240M148 0V240M232 0V240M316 0V240"/>
    <path d="M0 46H400M0 132H400M0 206H400"/>
  </g>
  <g fill="#1B0E2A" opacity="0.16">
    <rect x="0" y="24" width="10" height="192"/>
    <rect x="390" y="24" width="10" height="192"/>
  </g>

  <!-- cornisa escueta -->
  <rect x="0" y="0" width="400" height="24" fill="url(#f4_cornisa)"/>
  <path d="M0 24H400" stroke="#1B0E2A" stroke-width="7"/>
  <g fill="#1B0E2A" opacity="0.3">
    <rect x="20" y="18" width="360" height="3"/>
  </g>

  <!-- carteles pegados: barras de tinta en vez de texto -->
  <g stroke="#1B0E2A" stroke-width="3.5" stroke-linejoin="round">
    <g transform="rotate(-6 37 50)">
      <rect x="14" y="32" width="46" height="36" fill="url(#f4_papel)"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M21 42H52M21 50H45M21 58H38"/>
      </g>
    </g>
    <g transform="rotate(4 91 48)">
      <rect x="68" y="30" width="46" height="36" fill="#FF1F8F"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M75 40H106M75 48H99"/>
      </g>
      <circle cx="102" cy="58" r="4.5" fill="#1B0E2A" stroke="none"/>
    </g>
    <g transform="rotate(-3 145 48)">
      <rect x="122" y="32" width="46" height="34" fill="url(#f4_papel)"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M129 42H158M129 50H150M129 58H140"/>
      </g>
    </g>
    <g transform="rotate(7 199 50)">
      <rect x="176" y="30" width="46" height="38" fill="#C6FF00"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M183 42H212M183 50H203M183 58H194"/>
      </g>
    </g>
    <g transform="rotate(-5 253 48)">
      <rect x="230" y="32" width="46" height="34" fill="url(#f4_papel)"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M237 42H266M237 50H257"/>
      </g>
    </g>
    <g transform="rotate(3 305 50)">
      <rect x="284" y="30" width="44" height="38" fill="url(#f4_papel)"/>
      <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
        <path d="M291 42H320M291 50H312M291 58H304"/>
      </g>
    </g>
  </g>
  <!-- cartel arrancado a medias -->
  <path d="M340 32L378 32L378 62L364 56L352 64L344 54L340 44Z" fill="#F6E7C8" stroke="#1B0E2A"
        stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M346 44H370M346 54H362" stroke="#1B0E2A" stroke-width="3" stroke-linecap="round"/>

  <!-- ventanas: marco claro, una chapada, otra con papeles y otra rota con planta -->
  <rect x="36" y="70" width="74" height="62" fill="#F6E7C8" stroke="#1B0E2A"
        stroke-width="5" stroke-linejoin="round"/>
  <path d="M40 78H110V126H40Z" fill="url(#f4_chapa)" stroke="#1B0E2A" stroke-width="4"
        stroke-linejoin="round"/>
  <g stroke="#4A5478" stroke-width="3" fill="none">
    <path d="M50 78V126M60 78V126M70 78V126M80 78V126M90 78V126M100 78V126"/>
  </g>
  <path d="M40 92H110" stroke="#1B0E2A" stroke-width="4" opacity="0.7"/>

  <rect x="164" y="70" width="72" height="64" fill="#F6E7C8" stroke="#1B0E2A"
        stroke-width="5" stroke-linejoin="round"/>
  <rect x="172" y="78" width="56" height="48" fill="#150A22" stroke="#1B0E2A"
        stroke-width="4"/>
  <g fill="#F6E7C8" stroke="#1B0E2A" stroke-width="2.5">
    <path d="M178 108L192 96L204 110L214 100L222 112L222 124H178Z"/>
  </g>
  <path d="M196 78V126" stroke="#1B0E2A" stroke-width="4" opacity="0.8"/>

  <rect x="292" y="70" width="72" height="62" fill="#F6E7C8" stroke="#1B0E2A"
        stroke-width="5" stroke-linejoin="round"/>
  <rect x="300" y="78" width="56" height="46" fill="#150A22" stroke="#1B0E2A"
        stroke-width="4"/>
  <g stroke="#8894B5" stroke-width="4" fill="none">
    <path d="M328 78V124M300 101H356"/>
  </g>
  <g fill="none" stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
    <path d="M304 86L316 98L308 110"/>
    <path d="M352 90L342 100"/>
  </g>
  <!-- planta saliendo por la ventana rota -->
  <path d="M312 128Q316 140 308 148" fill="none" stroke="#1B0E2A" stroke-width="4"
        stroke-linecap="round"/>
  <g fill="#2FBF71" stroke="#1B0E2A" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="302" cy="140" rx="11" ry="6" transform="rotate(-28 302 140)"/>
    <ellipse cx="318" cy="150" rx="12" ry="6" transform="rotate(22 318 150)"/>
    <ellipse cx="296" cy="156" rx="9" ry="5" transform="rotate(-14 296 156)"/>
  </g>

  <!-- antena parabólica: el lujo cutre -->
  <path d="M368 124V150" stroke="#1B0E2A" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(-18 356 158)">
    <ellipse cx="356" cy="158" rx="26" ry="9" fill="#8894B5" stroke="#1B0E2A"
             stroke-width="4" stroke-linejoin="round"/>
    <path d="M342 154L370 162M356 150V166" stroke="#1B0E2A" stroke-width="2.5"/>
  </g>

  <!-- grafiti: estrella, careta y flecha; todo formas, ni una letra -->
  <g stroke="#1B0E2A" stroke-linejoin="round">
    <path d="M62 176L70 158L78 176L96 178L82 190L86 208L70 198L54 208L58 190L44 178Z"
          fill="#C6FF00" stroke-width="5"/>
    <circle cx="180" cy="176" r="40" fill="#FF1F8F" stroke-width="6"/>
    <circle cx="166" cy="166" r="10" fill="#F6E7C8" stroke-width="4"/>
    <circle cx="194" cy="166" r="10" fill="#F6E7C8" stroke-width="4"/>
    <circle cx="167" cy="167" r="4" fill="#1B0E2A" stroke="none"/>
    <circle cx="195" cy="167" r="4" fill="#1B0E2A" stroke="none"/>
    <path d="M158 190q22 16 44 0" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 140q14 -10 30 -4" fill="none" stroke-width="4" stroke-linecap="round"/>
    <path d="M256 200q18 -34 44 -30" fill="none" stroke="#00E5FF" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M296 162L310 168L298 180" fill="none" stroke="#00E5FF" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M262 210q26 -8 52 2" fill="none" stroke="#6A2BA8" stroke-width="8"
          stroke-linecap="round"/>
  </g>
  <g fill="#A80F6B" opacity="0.55">
    <path d="M164 214q3 12 0 18q-6 -4 0 -18z"/>
    <path d="M196 214q3 10 1 16q-6 -4 -1 -16z"/>
    <path d="M74 210q3 12 0 16q-5 -4 0 -16z"/>
  </g>
  <g fill="#1B0E2A" opacity="0.3">
    <circle cx="120" cy="150" r="2.5"/>
    <circle cx="132" cy="142" r="2"/>
    <circle cx="236" cy="196" r="2.5"/>
    <circle cx="246" cy="186" r="2"/>
    <circle cx="90" cy="196" r="2"/>
  </g>

  <!-- papelitos pegados donde acaba el grafiti -->
  <g fill="#F6E7C8" stroke="#1B0E2A" stroke-width="3" stroke-linejoin="round">
    <path d="M112 196L136 198L134 212L110 210Z"/>
    <path d="M144 200L160 198L162 210L146 212Z" opacity="0.85"/>
  </g>

  <!-- cable y zócalo -->
  <path d="M0 40Q110 62 220 42T400 46" fill="none" stroke="#1B0E2A" stroke-width="7"
        stroke-linecap="round"/>
  <path d="M0 40Q110 62 220 42T400 46" fill="none" stroke="#FF6A00" stroke-width="3"
        stroke-linecap="round"/>

  <rect x="0" y="216" width="400" height="24" fill="#4A5478"/>
  <path d="M0 216H400" stroke="#1B0E2A" stroke-width="6"/>
  <g fill="#1B0E2A" opacity="0.3">
    <path d="M0 216h400v6H0Z"/>
  </g>
  <g fill="none" stroke="#1B0E2A" stroke-width="4" opacity="0.5">
    <path d="M88 216V240M206 216V240M324 216V240"/>
  </g>
  <g fill="#2FBF71" stroke="#1B0E2A" stroke-width="3" stroke-linejoin="round">
    <circle cx="58" cy="228" r="8"/>
    <circle cx="70" cy="232" r="5"/>
    <circle cx="346" cy="226" r="9"/>
    <circle cx="360" cy="231" r="5"/>
  </g>
</svg>
