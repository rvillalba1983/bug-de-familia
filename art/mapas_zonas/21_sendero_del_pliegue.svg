<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#2196f3" stroke-width="2"/>
  <rect x="20" y="40" width="640" height="440" fill="#2196f3" opacity="0.1"/>
  <rect x="0" y="0" width="25" height="30" fill="#0d1b2a"/>
  <rect x="175" y="0" width="25" height="30" fill="#0d1b2a"/>
  <rect x="0" y="90" width="25" height="30" fill="#0d1b2a"/>
  <rect x="175" y="90" width="25" height="30" fill="#0d1b2a"/>
  <rect x="50" y="40" width="30" height="20" fill="#0d1b2a"/>
  <rect x="120" y="60" width="30" height="20" fill="#0d1b2a"/>
  <!-- Sendero (estrecho) -->
  <rect x="40" y="80" width="60" height="25" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="80" width="40" height="25" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="105" width="100" height="25" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="130" width="60" height="25" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="130" width="40" height="25" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <!-- Plegados (archivo) -->
  <rect x="200" y="180" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="280" y="180" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="180" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Manada (almacén) -->
  <rect x="200" y="260" width="60" height="40" fill="#ff9800" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="280" y="260" width="60" height="40" fill="#ff9800" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="260" width="60" height="40" fill="#ff9800" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Montañas -->
  <polygon points="500,80 540,40 580,80" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <polygon points="560,120 600,80 640,120" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <!-- Corredores -->
  <rect x="80" y="0" width="15" height="40" fill="#2196f3" opacity="0.6"/>
  <rect x="80" y="110" width="15" height="40" fill="#2196f3" opacity="0.6"/>
  <rect x="0" y="65" width="40" height="15" fill="#2196f3" opacity="0.6"/>
  <rect x="130" y="65" width="40" height="15" fill="#2196f3" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="70" cy="95" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="230" cy="205" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="390" cy="285" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <!-- Etiquetas de bordes -->
  
  
  
  
</svg>
