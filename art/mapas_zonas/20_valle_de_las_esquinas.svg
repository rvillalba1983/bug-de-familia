<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#2196f3" stroke-width="2"/>
  <rect x="20" y="40" width="640" height="440" fill="#2196f3" opacity="0.1"/>
  <rect x="0" y="0" width="25" height="30" fill="#0d1b2a"/>
  <rect x="145" y="0" width="25" height="25" fill="#0d1b2a"/>
  <rect x="0" y="120" width="30" height="30" fill="#0d1b2a"/>
  <rect x="140" y="125" width="30" height="25" fill="#0d1b2a"/>
  <rect x="45" y="45" width="20" height="15" fill="#0d1b2a"/>
  <rect x="105" y="80" width="20" height="15" fill="#0d1b2a"/>
  <!-- Valle (zigzag) -->
  <rect x="40" y="80" width="60" height="30" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="80" width="40" height="30" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="110" width="100" height="30" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="40" y="140" width="60" height="30" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <rect x="100" y="140" width="40" height="30" fill="#2196f3" opacity="0.5" stroke="#ffffff" stroke-width="1"/>
  <!-- Montañas -->
  <polygon points="60,60 90,30 120,60" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <polygon points="200,80 240,40 280,80" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <polygon points="400,60 440,20 480,60" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <polygon points="550,80 590,40 630,80" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  <!-- Plegados (archivo) -->
  <rect x="200" y="180" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="280" y="180" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Ecos (túnel) -->
  <rect x="400" y="180" width="60" height="40" fill="#9c27b0" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="480" y="180" width="60" height="40" fill="#9c27b0" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Grux (puestos) -->
  <rect x="200" y="260" width="50" height="35" fill="#ffc107" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="280" y="260" width="50" height="35" fill="#ffc107" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="260" width="50" height="35" fill="#ffc107" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Corredores -->
  <rect x="80" y="0" width="15" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="80" y="120" width="15" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="0" y="65" width="35" height="15" fill="#2196f3" opacity="0.6"/>
  <rect x="135" y="65" width="35" height="15" fill="#2196f3" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="90" cy="80" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="230" cy="205" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="385" cy="282" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <!-- Etiquetas de bordes -->
  
  
  
  
</svg>
