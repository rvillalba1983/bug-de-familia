<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#4caf50" stroke-width="2"/>
  <!-- Forma zigzag: bloques bloqueados en esquinas -->
  <rect x="20" y="40" width="640" height="440" fill="#4caf50" opacity="0.15"/>
  <rect x="20" y="40" width="80" height="70" fill="#0d1b2a"/>
  <rect x="580" y="40" width="80" height="50" fill="#0d1b2a"/>
  <rect x="20" y="410" width="60" height="70" fill="#0d1b2a"/>
  <rect x="580" y="430" width="80" height="50" fill="#0d1b2a"/>
  <rect x="100" y="110" width="50" height="40" fill="#0d1b2a"/>
  <rect x="500" y="160" width="40" height="35" fill="#0d1b2a"/>
  <!-- Corredores a bordes -->
  <rect x="320" y="40" width="40" height="60" fill="#4caf50" opacity="0.6"/>
  <rect x="320" y="420" width="40" height="60" fill="#4caf50" opacity="0.6"/>
  <rect x="20" y="230" width="50" height="30" fill="#4caf50" opacity="0.6"/>
  <rect x="610" y="230" width="50" height="30" fill="#4caf50" opacity="0.6"/>
  <!-- Bosque (árboles) -->
  <circle cx="100" cy="100" r="14" fill="#2FBF71" opacity="0.7"/>
  <circle cx="130" cy="80" r="12" fill="#2FBF71" opacity="0.6"/>
  <circle cx="80" cy="130" r="10" fill="#2FBF71" opacity="0.5"/>
  <circle cx="540" cy="100" r="14" fill="#2FBF71" opacity="0.7"/>
  <circle cx="570" cy="80" r="12" fill="#2FBF71" opacity="0.6"/>
  <circle cx="510" cy="130" r="10" fill="#2FBF71" opacity="0.5"/>
  <circle cx="100" cy="380" r="14" fill="#2FBF71" opacity="0.7"/>
  <circle cx="540" cy="380" r="14" fill="#2FBF71" opacity="0.7"/>
  <circle cx="340" cy="180" r="16" fill="#2FBF71" opacity="0.8"/>
  <circle cx="340" cy="340" r="16" fill="#2FBF71" opacity="0.8"/>
  <!-- Ciudad perdida (edificios) -->
  <rect x="260" y="200" width="50" height="40" fill="#A8482A" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="330" y="200" width="40" height="40" fill="#A8482A" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="260" y="260" width="40" height="30" fill="#A8482A" stroke="#ffffff" stroke-width="1"/>
  <rect x="330" y="260" width="40" height="30" fill="#A8482A" stroke="#ffffff" stroke-width="1"/>
  <rect x="390" y="220" width="30" height="30" fill="#8894B5" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Tierra de nadie (franja central) -->
  <rect x="100" y="240" width="480" height="40" fill="#A8482A" opacity="0.3" stroke="#FF6A00" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Guardados -->
  <circle cx="100" cy="100" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="580" cy="100" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="340" cy="200" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="340" cy="380" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <!-- Etiquetas de bordes -->
  
  
  
  
  
</svg>
