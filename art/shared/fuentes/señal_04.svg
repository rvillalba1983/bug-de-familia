<?xml version="1.0" encoding="UTF-8"?>
<!--
  señal_04 · Tela atada
  Origen: brief del director (señales improvisadas de Bug de Familia)
  Herramienta: generación de SVG por código
  Lienzo 512x320 · fondo transparente · piezas editables
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320">

  <defs>
    <linearGradient id="s4_tela" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#D6C9AB"/>
      <stop offset="0.55" stop-color="#C0B091"/>
      <stop offset="1" stop-color="#A3937A"/>
    </linearGradient>
    <linearGradient id="s4_poste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F3524"/>
      <stop offset="0.45" stop-color="#7C5A3A"/>
      <stop offset="1" stop-color="#432C1E"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="268" cy="304" rx="132" ry="12" fill="#1B0E2A" opacity="0.22"/>

  <!-- poste inclinado -->
  <g id="s4_poste" stroke="#1B0E2A" stroke-width="6" stroke-linejoin="round"
