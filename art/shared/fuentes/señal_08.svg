      <stop offset="0.6" stop-color="#8C8E84"/>
      <stop offset="1" stop-color="#6C6F66"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="250" cy="304" rx="180" ry="13" fill="#1B0E2A" opacity="0.24"/>

  <!-- losa inclinada -->
