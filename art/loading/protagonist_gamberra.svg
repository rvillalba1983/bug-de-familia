<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <!-- Cuerpo -->
  <rect x="70" y="120" width="60" height="80" rx="10" fill="#4a90d9"/>
  <!-- Cabeza -->
  <circle cx="100" cy="80" r="40" fill="#f5d0a9"/>
  <!-- Ojos -->
  <circle cx="85" cy="75" r="5" fill="#333"/>
  <circle cx="115" cy="75" r="5" fill="#333"/>
  <!-- Sonrisa -->
  <path d="M 80 90 Q 100 105 120 90" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Brazos abiertos -->
  <line x1="70" y1="140" x2="30" y2="100" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <line x1="130" y1="140" x2="170" y2="100" stroke="#4a90d9" stroke-width="8" stroke-linecap="round"/>
  <!-- Piernas -->
  <line x1="80" y1="200" x2="70" y2="270" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="200" x2="130" y2="270" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- Zapatos -->
  <ellipse cx="65" cy="275" rx="15" ry="8" fill="#333"/>
  <ellipse cx="135" cy="275" rx="15" ry="8" fill="#333"/>
</svg>