<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="sans-serif">
  <rect width="680" height="520" fill="#1a2a3a"/>
  
  <rect x="20" y="40" width="640" height="440" fill="#0d1b2a" stroke="#2196f3" stroke-width="2"/>
  <rect x="20" y="40" width="640" height="440" fill="#2196f3" opacity="0.1"/>
  <!-- Forma T invertida: bloqueados en esquinas -->
  <rect x="20" y="40" width="90" height="60" fill="#0d1b2a"/>
  <rect x="570" y="40" width="90" height="60" fill="#0d1b2a"/>
  <rect x="20" y="420" width="70" height="60" fill="#0d1b2a"/>
  <rect x="590" y="420" width="70" height="60" fill="#0d1b2a"/>
  <rect x="280" y="100" width="120" height="50" fill="#0d1b2a"/>
  <!-- Archivo (estanterías, documentos) -->
  <rect x="120" y="120" width="80" height="60" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="220" y="120" width="60" height="60" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="300" y="170" width="80" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="400" y="120" width="60" height="60" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="480" y="120" width="80" height="60" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Jubilados (mantenimiento) -->
  <rect x="120" y="280" width="60" height="40" fill="#9e9e9e" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="200" y="280" width="60" height="40" fill="#9e9e9e" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Corredores -->
  <rect x="320" y="40" width="40" height="70" fill="#2196f3" opacity="0.6"/>
  <rect x="0" y="230" width="80" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="500" y="230" width="80" height="30" fill="#2196f3" opacity="0.6"/>
  <rect x="320" y="300" width="40" height="80" fill="#2196f3" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="160" cy="150" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="340" cy="200" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="520" cy="150" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
