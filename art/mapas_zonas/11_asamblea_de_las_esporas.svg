  <rect x="260" y="120" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <rect x="360" y="120" width="60" height="50" fill="#2196f3" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Corredores -->
  <rect x="80" y="0" width="15" height="60" fill="#009688" opacity="0.6"/>
  <rect x="0" y="65" width="55" height="15" fill="#009688" opacity="0.6"/>
  <rect x="135" y="65" width="55" height="15" fill="#009688" opacity="0.6"/>
  <rect x="80" y="95" width="15" height="60" fill="#009688" opacity="0.6"/>
  <rect x="320" y="340" width="40" height="100" fill="#009688" opacity="0.6"/>
  <!-- Guardados -->
  <circle cx="120" cy="120" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="560" cy="120" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
  <circle cx="290" cy="150" r="5" fill="#FFD400" stroke="#000000" stroke-width="1"/>
