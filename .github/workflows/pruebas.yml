name: Pruebas

on:
  push:
    branches: ['**']
    # Un commit que solo toca documentacion no valida codigo: ahorra ~8 min/run.
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    # El push ya cubre cada commit de la rama; evitar el run duplicado por synchronize.
    types: [opened, reopened, ready_for_review]

# No empujar mientras el run de verificacion este en curso: con
# cancel-in-progress, un push nuevo cancela la validacion anterior (10-nov).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificaciones deterministas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificaciones deterministas (datos y normas)
        run: python3 tools/verificar.py

  pruebas:
    name: Pruebas GdUnit4 (${{ matrix.grupo }})
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: 'core'
            carpetas: '-a res://tests/core -a res://tests/entities -a res://tests/body'
          - grupo: 'combate'
            carpetas: '-a res://tests/combat -a res://tests/conversion -a res://tests/stealth'
          - grupo: 'simulacion'
            carpetas: '-a res://tests/ai -a res://tests/investigation -a res://tests/simulation'
          - grupo: 'beta'
            carpetas: '-a res://tests/beta -a res://tests/flows -a res://tests/ui -a res://tests/art -a res://tests/data -a res://tests/sandbox'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-4.7.2-stable-linux-${{ runner.os }}-v1

      - name: Descargar Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          curl -L -o /tmp/godot/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Añadir Godot al PATH
        run: echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Importar proyecto
        run: godot --headless --import
        timeout-minutes: 5

      - name: Ejecutar pruebas GdUnit4
        id: pruebas
        run: |
          set +e
          timeout -k 30 600 godot --headless -s -d \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            ${{ matrix.carpetas }} \
            -c </dev/null > pruebas.log 2>&1
          EXIT_CODE=$?
          set -e
          cat pruebas.log
          if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
            echo "::error::Las pruebas excedieron el tiempo limite de 600 segundos"
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Las pruebas fallaron con codigo de salida $EXIT_CODE"
          fi
          exit "$EXIT_CODE"

      - name: Resumen de pruebas
        if: always()
        run: |
          if [ -f pruebas.log ]; then
            echo "## Resultados de pruebas GdUnit4 (${{ matrix.grupo }})" >> "$GITHUB_STEP_SUMMARY"
            sed 's/\x1b\[[0-9;]*m//g' pruebas.log | \
              grep -E "^(Overall Summary:|Executed test suites:|Executed test cases :|Total execution time:)" >> "$GITHUB_STEP_SUMMARY" || true
          fi
