<?xml version="1.0" encoding="UTF-8"?>
<!--
  señal_01 · Tabla clavada
  Origen: brief del director (señales improvisadas de Bug de Familia)
  Herramienta: generación de SVG por código
  Lienzo 512x320 · fondo transparente · piezas editables
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 512 320">

  <defs>
    <linearGradient id="s1_tabla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AD8459"/>
      <stop offset="0.55" stop-color="#8A6440"/>
      <stop offset="1" stop-color="#63462D"/>
    </linearGradient>
    <linearGradient id="s1_poste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F3524"/>
      <stop offset="0.42" stop-color="#7C5A3A"/>
      <stop offset="1" stop-color="#432C1E"/>
    </linearGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="258" cy="302" rx="150" ry="13" fill="#1B0E2A" opacity="0.25"/>

  <!-- poste de madera -->
  <g id="s1_poste" stroke="#1B0E2A" stroke-width="6" stroke-linejoin="round"
     stroke-linecap="round">
    <path d="M240 304 L234 148 L262 144 L270 304 Z" fill="url(#s1_poste)"/>
    <path d="M247 296 L244 210 M256 292 L254 176" fill="none" stroke="#432C1E"
          stroke-width="3" opacity="0.7"/>
  </g>

  <!-- tablón principal, torcido -->
  <g id="s1_tablon" transform="rotate(-5 256 132)">
    <path d="M62 74 L150 69 L252 65 L356 60 L452 57 L455 92 L457 128 L459 186
             L360 191 L250 196 L150 200 L66 203 L63 150 L61 112 Z"
          fill="url(#s1_tabla)" stroke="#1B0E2A" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- veta -->
    <g fill="none" stroke="#5A3E28" stroke-width="2.5" opacity="0.65"
       stroke-linecap="round">
      <path d="M80 96 q70 -7 140 -5 q80 2 150 -4"/>
      <path d="M84 116 q66 -5 132 -3 q86 3 168 -2"/>
      <path d="M88 178 q72 5 146 3 q80 -2 152 1"/>
      <path d="M96 156 q58 4 120 2"/>
    </g>
    <!-- nudos -->
    <ellipse cx="392" cy="112" rx="9" ry="13" fill="#5A3E28" stroke="#3C2719"
             stroke-width="2.5"/>
    <ellipse cx="140" cy="160" rx="6" ry="9" fill="#5A3E28" stroke="#3C2719"
             stroke-width="2"/>

    <!-- clavos -->
    <g fill="#8C93A2" stroke="#1B0E2A" stroke-width="4">
      <circle cx="90" cy="92" r="7"/>
      <circle cx="424" cy="78" r="7"/>
      <circle cx="428" cy="168" r="7"/>
      <circle cx="96" cy="182" r="7"/>
    </g>
    <g stroke="#3F4A5C" stroke-width="2.5" stroke-linecap="round">
      <path d="M86 92 h8 M420 78 h8 M424 168 h8 M92 182 h8"/>
    </g>

    <!-- letras pintadas a brocha -->
    <text x="256" y="140" text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif" font-weight="bold"
          font-size="54" letter-spacing="2" fill="#EADCB4" stroke="none"
          >POR AQUÍ</text>

    <!-- flecha pintada -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M152 172 L318 165" fill="none" stroke="#1B0E2A" stroke-width="16"
            opacity="0.55"/>
      <path d="M152 172 L318 165" fill="none" stroke="#EADCB4" stroke-width="9"/>
      <path d="M300 143 L336 164 L300 182 Z" fill="#EADCB4" stroke="#1B0E2A"
            stroke-width="4"/>
    </g>

    <!-- goterones de pintura y astillas -->
    <g fill="#EADCB4" opacity="0.6">
      <path d="M186 152 q3 12 1 20 q-6 -3 -1 -20z"/>
      <path d="M282 148 q2 10 0 16 q-5 -3 0 -16z"/>
    </g>
    <path d="M440 176 q10 6 6 18 q-10 -2 -6 -18z" fill="#63462D"
          stroke="#1B0E2A" stroke-width="3"/>
  </g>

  <!-- tablilla pequeña clavada debajo -->
  <g id="s1_tablilla" transform="rotate(7 190 244)">
    <path d="M126 224 L246 219 L250 264 L130 269 Z" fill="#7C5A3A"
          stroke="#1B0E2A" stroke-width="6" stroke-linejoin="round"
          stroke-linecap="round"/>
    <path d="M152 236 L176 258 M176 236 L152 258" stroke="#4A3020" stroke-width="4"
          stroke-linecap="round"/>
    <g fill="#8C93A2" stroke="#1B0E2A" stroke-width="3.5">
      <circle cx="140" cy="232" r="5"/>
      <circle cx="236" cy="228" r="5"/>
    </g>
  </g>

  <!-- musgo y barro en la base -->
  <g stroke="#1B0E2A" stroke-width="3" stroke-linecap="round">
    <path d="M226 296 q12 -12 26 -2 q10 8 22 2 q-6 10 -24 8 q-18 -2 -24 -8z"
          fill="#4E7A52"/>
    <path d="M266 300 q10 -9 22 -3 q-8 8 -22 3z" fill="#2F5238"/>
  </g>
</svg>
